<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Orbitron:wght@500;700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/theme.css' | relative_url }}">
  {% seo %}
  {% feed_meta %}
</head>
<body>
  <div class="shell">
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}">Frank R. Haugen</a>
      <span class="brand-tag">Public work / dev log</span>
      <nav class="nav" aria-label="Primary">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/blog/' | relative_url }}">Blog</a>
        <a href="https://github.com/frankhaugen">GitHub</a>
        <a href="https://www.frankhaugen.com">Website</a>
        <a href="https://www.youtube.com/@frankhaugen">YouTube</a>
      </nav>
    </header>
    <main>
      {{ content }}
    </main>
    <footer class="site-footer">
      <p>Hosted on <a href="https://pages.github.com/">GitHub Pages</a> — <a href="https://github.com/frankhaugen/frankhaugen.github.io">source</a></p>
    </footer>
  </div>
</body>
</html>
